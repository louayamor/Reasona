artifacts_root: artifacts

preprocess:
  dataset_name: PleIAs/SYNTH
  split: train
  revision: main
  max_samples: null
  cache_dir: ~/.cache/huggingface/datasets

  # Streaming optimization
  buffer_size: 10000
  prefetch_buffer: 500          # optional, default in dataclass
  block_size: 128MiB            # optional, default in dataclass
  num_workers: 2                # optional, default in dataclass

training:
  dataset_path: artifacts/dataset
  output_dir: artifacts/models
  base_model: sentence-transformers/all-MiniLM-L6-v2

indexing:
  dataset_path: null              # optional
  vector_store_dir: artifacts/vectorstore
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size: 512
  chunk_overlap: 50
  workers: 1
  batch_size: 64
  queue_size: 512                 # optional, default in dataclass

inference:
  model_path: artifacts/models/my_model
  tokenizer_path: null             # optional
  engine: transformer
  max_tokens: 256
  temperature: 0.7
