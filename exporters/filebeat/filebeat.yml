filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /app/logs/**/*.log
      - /app/logs/**/*.json

    scan_frequency: 5s

    ignore_older: 24h
    close_inactive: 1h

    multiline.pattern: '^\{'
    multiline.negate: true
    multiline.match: after

    json.keys_under_root: true       
    json.add_error_key: true         
    json.message_key: message        
    json.overwrite_keys: true        

    fields:
      service: reasona
      environment: dev
    fields_under_root: true         

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat.log
  keepfiles: 7
  permissions: 0644
