retrieval:
  top_k: 50
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  nprobe: 16

reranker:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 10
  batch_size: 16

evaluation:
  dataset: artifacts/eval/qa.json
  metrics:
    - recall@k
    - mrr
    - ndcg
  k_values: [1, 5, 10]
  max_queries: 1000

inference:
  provider: hf             
  model: mistralai/Mistral-7B-Instruct-v0.2
  max_tokens: 256
  temperature: 0.7
  top_p: 0.9
  batch_size: 8