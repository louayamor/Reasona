artifacts_root: artifacts

preprocess:
  dataset_name: codelion/synth-1B
  split: train
  language: en
  revision: main
  max_samples: null
  cache_dir: ~/.cache/huggingface/datasets
  shuffle_buffer: 1000
  prefetch_buffer: 512



training:
  dataset_path: artifacts/dataset
  output_dir: artifacts/models
  base_model: sentence-transformers/all-MiniLM-L6-v2


indexing:
  dataset_path: null
  vector_store_dir: artifacts/vectorstore
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

  chunk_size: 2048
  chunk_overlap: 0

  workers: 4
  batch_size: 256
  queue_size: 10000


inference:
  model_path: artifacts/models/my_model
  tokenizer_path: null
  engine: transformer
  max_tokens: 256
  temperature: 0.7
