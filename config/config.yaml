artifacts_root: artifacts

preprocess:
  dataset_name: wikimedia/wikipedia
  dataset_config: 20231101.en  
  split: train
  max_samples: 4000000
  cache_dir: ~/.cache/huggingface/datasets
  shuffle_buffer: 2000
  prefetch_buffer: 1024
  schema_path: config/schema.yaml


indexing:
  vector_store_dir: artifacts/vectors
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size: 700 # using bigger chunk to reduce overhead, fits my gpu memory
  chunk_overlap: 50 # overlapping chunks to improve retrieval accuracy
  batch_size: 32 # depending on my gpu usage (rtx 2050 )
  queue_size: 1200
  log_every: 500000
  save_every: 500000

training:
  dataset_path: artifacts/dataset
  output_dir: artifacts/models
  base_model: sentence-transformers/all-MiniLM-L6-v2

inference:
  engine: rag
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  vector_store_dir: artifacts/vectors
  generator:
    provider: hf
    model: mistralai/Mistral-7B-Instruct-v0.2
    max_tokens: 256
    temperature: 0.7
  prompt:
    template_path: config/prompts/rag_prompt.txt

retrieval:
  vector_store_dir: artifacts/vectors
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 5
  engine: vector_search

