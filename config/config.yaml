artifacts_root: artifacts

preprocess:
  dataset_name: codelion/synth-1B
  split: train
  language: en
  revision: main
  max_samples: null
  cache_dir: ~/.cache/huggingface/datasets
  shuffle_buffer: 1000
  prefetch_buffer: 512



training:
  dataset_path: artifacts/dataset
  output_dir: artifacts/models
  base_model: sentence-transformers/all-MiniLM-L6-v2


indexing:
  vector_store_dir: artifacts/vectors
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size: 500
  chunk_overlap: 50
  batch_size: 64
  queue_size: 100
  log_every: 100000
  save_every: 200000
  keep_versions: 5


inference:
  model_path: artifacts/models/my_model
  tokenizer_path: null
  engine: transformer
  max_tokens: 256
  temperature: 0.7
