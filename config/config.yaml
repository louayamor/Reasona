artifacts_root: artifacts

preprocess:
  dataset_name: codelion/synth-1B
  split: train
  language: en
  revision: main
  max_samples: 100000
  cache_dir: ~/.cache/huggingface/datasets
  shuffle_buffer: 1000
  prefetch_buffer: 512
  schema_path: config/dataset_schema.yaml 



training:
  dataset_path: artifacts/dataset
  output_dir: artifacts/models
  base_model: sentence-transformers/all-MiniLM-L6-v2


indexing:
  vector_store_dir: artifacts/vectors
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

  chunk_size: 600
  chunk_overlap: 0

  batch_size: 32

  queue_size: 500

  log_every: 20000
  save_every: 20000

  keep_versions: 1

retrieval:
  vector_store_dir: artifacts/vectors
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 5
  engine: vector_search


inference:
  model_path: artifacts/models/my_model
  tokenizer_path: null
  engine: transformer
  max_tokens: 256
  temperature: 0.7
