artifacts_root: artifacts

preprocess:
  dataset_name: wikimedia/wikipedia
  dataset_config: 20231101.en
  split: train
  max_samples: 3000000
  cache_dir: artifacts/hf_cache
  shuffle_buffer: 4096
  prefetch_buffer: 1024
  schema_path: config/schema.yaml

indexing:
  vector_store_dir: artifacts/vectors
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size: 512
  chunk_overlap: 32
  batch_size: 32
  queue_size: 32
  max_vectors: 4000000
  log_every: 100000
  save_every: 100000
  device: cuda
  embedding_dim: 384

retrieval:
  vector_store_dir: artifacts/vectors
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_dim: 384
  top_k: 5
  engine: vector_search
  max_workers: 8
  use_cache: true
  debug: true
  batch_size: 16
  log_every: 500
  device: cuda
  nprobe: 256

reranker:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 10
  batch_size: 16

inference:
  engine: rag
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  vector_store_dir: artifacts/vectors
  generator:
    provider: hf
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    max_tokens: 512
    temperature: 0.7
    top_p: 0.95
    repetition_penalty: 1.05
    load_in_4bit: true
    device_map: "auto"
    compute_dtype: float16
  prompt:
    template_path: config/prompts/rag_prompt.txt


