name: DVC Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dvc:
    runs-on: ubuntu-latest

    env:
      DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      DVC_REMOTE: "https://${{ secrets.DAGSHUB_USER }}:${{ secrets.DAGSHUB_TOKEN }}@dagshub.com/${{ secrets.DAGSHUB_USER }}/Reasona.dvc"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install DVC with HTTP support
        run: pip install --upgrade "dvc[http]"

      - name: Configure DVC remote
        run: |
          dvc remote add -d origin ${{ env.DVC_REMOTE }} || echo "Remote already exists"

      - name: Push DVC artifacts to DagsHub
        run: dvc push
